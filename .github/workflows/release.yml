# v로 시작하는 태그를 올리면 두 앱의 Windows·macOS(Apple Silicon) 설치 파일을 빌드해 초안 릴리스에 첨부함.
# 예) git tag -a v0.1.0 -m "VisionDrill 0.1.0" && git push origin v0.1.0
# 초안 릴리스를 먼저 하나 만들고 4개 빌드가 모두 거기에 올림 (빌드마다 초안이 따로 생기는 문제 방지).
# 확인이 끝나면 GitHub의 Releases 화면에서 직접 Publish.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - id: create
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `VisionDrill ${tag}`,
              body: [
                '## 설치 파일',
                '- **VisionDrill** (학습 앱): Windows `VisionDrill_*_x64-setup.exe`, macOS `VisionDrill_*_aarch64.dmg`',
                '- **VisionDrill Studio** (문제은행 관리): Windows `VisionDrill.Studio_*_x64-setup.exe`, macOS `VisionDrill.Studio_*_aarch64.dmg`',
                '',
                '서명하지 않은 앱이라 첫 실행 때 경고가 뜸. 해결 방법은 README의 설치 절 참고.',
              ].join('\n'),
              draft: true,
            });
            return String(data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
        app: [drill, studio]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: '. -> target' }
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/${{ matrix.app }}
          tauriScript: npm run tauri --
          releaseId: ${{ needs.create-release.outputs.release_id }}

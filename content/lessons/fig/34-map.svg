<svg xmlns="http://www.w3.org/2000/svg" class="vdfig" viewBox="0 0 780 390" role="img" aria-label="비전 태스크 지도. 한 시기 영상에서 이미지 분류에 위치를 더하면 객체 탐지, 화소를 더하면 의미 분할, 탐지에 객체별 마스크를 더하면 인스턴스 분할, 둘을 합치면 파놉틱 분할. 시간 축을 더하면 변화탐지와 다중 객체 추적">

<svg xmlns="http://www.w3.org/2000/svg" class="vdfig" viewBox="0 0 780 258" role="img" aria-label="2012년 AlexNet부터 2022년 ConvNeXt까지 대표 백본이 처음 공개된 해와 핵심 아이디어">

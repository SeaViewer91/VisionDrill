<svg xmlns="http://www.w3.org/2000/svg" class="vdfig" viewBox="0 0 700 228" role="img" aria-label="위는 배치 64를 한 번에 넣어 기울기를 구하고 한 번 갱신, 아래는 16장씩 네 번 역전파해 기울기를 더한 뒤 한 번 갱신">

<svg xmlns="http://www.w3.org/2000/svg" class="vdfig" viewBox="0 0 680 290" role="img" aria-label="한 관측값의 편차가 회귀로 설명된 부분과 잔차로 나뉘는 도식, 그리고 80개 동 전체의 SST가 SSR과 SSE로 나뉘는 막대">
<style>
.vdfig{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
.vdfig .s-fg{stroke:#1c2330}.vdfig .s-mu{stroke:#8a93a3}.vdfig .s-ac{stroke:#2563eb}.vdfig .s-bd{stroke:#c2410c}.vdfig .s-ok{stroke:#15803d}
.vdfig .f-fg{fill:#1c2330}.vdfig .f-mu{fill:#5a6475}.vdfig .f-ac{fill:#2563eb}.vdfig .f-acs{fill:#e6eefe}.vdfig .f-bd{fill:#c2410c}
.vdfig .f-bds{fill:#fdeee6}.vdfig .f-ok{fill:#15803d}.vdfig .f-sf{fill:#f0f2f5}.vdfig .f-bg{fill:#ffffff}
@media (prefers-color-scheme:dark){
.vdfig .s-fg{stroke:#e6e9ef}.vdfig .s-mu{stroke:#737c8c}.vdfig .s-ac{stroke:#6d9bff}.vdfig .s-bd{stroke:#fb8b5b}.vdfig .s-ok{stroke:#4ade80}
.vdfig .f-fg{fill:#e6e9ef}.vdfig .f-mu{fill:#a7afbd}.vdfig .f-ac{fill:#6d9bff}.vdfig .f-acs{fill:#1f2b45}.vdfig .f-bd{fill:#fb8b5b}
.vdfig .f-bds{fill:#3a2218}.vdfig .f-ok{fill:#4ade80}.vdfig .f-sf{fill:#222733}.vdfig .f-bg{fill:#1a1e26}}
</style>
<line x1="40.0" y1="250.0" x2="330.0" y2="250.0" class="s-mu" stroke-width="1.2"/>
<line x1="40.0" y1="30.0" x2="40.0" y2="250.0" class="s-mu" stroke-width="1.2"/>
<line x1="40.0" y1="180.0" x2="330.0" y2="180.0" class="s-mu" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="330.0" y="198.0" class="f-mu" font-size="12" text-anchor="end">평균 ȳ</text>
<line x1="40.0" y1="225.0" x2="330.0" y2="74.2" class="s-fg" stroke-width="2.2"/>
<text x="330.0" y="96.2" class="f-fg" font-size="12" text-anchor="end">회귀선 ŷ</text>
<line x1="230.0" y1="52.0" x2="230.0" y2="126.2" class="s-bd" stroke-width="3"/>
<line x1="230.0" y1="126.2" x2="230.0" y2="180.0" class="s-ac" stroke-width="3"/>
<line x1="208.0" y1="52.0" x2="208.0" y2="180.0" class="s-fg" stroke-width="1.2"/>
<line x1="208.0" y1="52.0" x2="214.0" y2="52.0" class="s-fg" stroke-width="1.2"/>
<line x1="208.0" y1="180.0" x2="214.0" y2="180.0" class="s-fg" stroke-width="1.2"/>
<text x="202.0" y="114.0" class="f-fg" font-size="12" text-anchor="end" font-weight="600">yᵢ − ȳ</text>
<text x="202.0" y="130.0" class="f-fg" font-size="11" text-anchor="end">(전체)</text>
<circle cx="230.0" cy="52.0" r="5" class="f-ac"/>
<text x="242.0" y="64.0" class="f-bd" font-size="12" text-anchor="start" font-weight="600">yᵢ − ŷᵢ (잔차)</text>
<text x="242.0" y="157.1" class="f-ac" font-size="12" text-anchor="start" font-weight="600">ŷᵢ − ȳ (설명됨)</text>
<text x="230.0" y="42.0" class="f-fg" font-size="12" text-anchor="middle">yᵢ</text>
<text x="475.0" y="26.0" class="f-fg" font-size="13" text-anchor="middle" font-weight="600">SST = 848.2</text>
<rect x="440.0" y="96.1" width="70.0" height="153.9" rx="0" class="s-ac f-acs" stroke-width="1.5"/>
<rect x="440.0" y="40.0" width="70.0" height="56.1" rx="0" class="s-bd f-bds" stroke-width="1.5"/>
<text x="524.0" y="169.0" class="f-ac" font-size="13" text-anchor="start" font-weight="600">SSR = 621.7</text>
<text x="524.0" y="187.0" class="f-ac" font-size="12" text-anchor="start">(73.3%, 설명됨)</text>
<text x="524.0" y="64.0" class="f-bd" font-size="13" text-anchor="start" font-weight="600">SSE = 226.5</text>
<text x="524.0" y="82.0" class="f-bd" font-size="12" text-anchor="start">(26.7%, 잔차)</text>
<text x="475.0" y="272.0" class="f-fg" font-size="13" text-anchor="middle" font-weight="600">R² = 0.733</text>
</svg>

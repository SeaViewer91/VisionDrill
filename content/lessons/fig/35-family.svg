<text x="274.0" y="102.0" class="f-ac" font-size="13" text-anchor="start" font-weight="bold">A</text>
<text x="334.0" y="152.0" class="f-bd" font-size="13" text-anchor="start" font-weight="bold">B</text>
<text x="346.0" y="24.0" class="f-fg" font-size="14" text-anchor="middle" font-weight="bold">GIoU</text>
<text x="420.0" y="56.0" class="f-mu" font-size="13" text-anchor="end" font-weight="bold">C</text>
<text x="346.0" y="196.0" class="f-mu" font-size="12" text-anchor="middle">빈 공간(회색) ÷ C 를 뺌</text>
<rect x="502.0" y="40.0" width="160.0" height="120.0" rx="0" class="s-mu f-sf" stroke-width="1.3" stroke-dasharray="5 4"/>

<svg xmlns="http://www.w3.org/2000/svg" class="vdfig" viewBox="0 0 720 215" role="img" aria-label="IoU는 교집합과 합집합, GIoU는 두 상자를 감싸는 최소 상자 C의 빈 공간, DIoU는 중심 거리 ρ와 C의 대각선 c를 씀">
<style>
.vdfig{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
.vdfig .s-fg{stroke:#1c2330}.vdfig .s-mu{stroke:#8a93a3}.vdfig .s-ac{stroke:#2563eb}.vdfig .s-bd{stroke:#c2410c}.vdfig .s-ok{stroke:#15803d}
.vdfig .f-fg{fill:#1c2330}.vdfig .f-mu{fill:#5a6475}.vdfig .f-ac{fill:#2563eb}.vdfig .f-acs{fill:#e6eefe}.vdfig .f-bd{fill:#c2410c}
.vdfig .f-bds{fill:#fdeee6}.vdfig .f-ok{fill:#15803d}.vdfig .f-sf{fill:#f0f2f5}.vdfig .f-bg{fill:#ffffff}
@media (prefers-color-scheme:dark){
.vdfig .s-fg{stroke:#e6e9ef}.vdfig .s-mu{stroke:#737c8c}.vdfig .s-ac{stroke:#6d9bff}.vdfig .s-bd{stroke:#fb8b5b}.vdfig .s-ok{stroke:#4ade80}
.vdfig .f-fg{fill:#e6e9ef}.vdfig .f-mu{fill:#a7afbd}.vdfig .f-ac{fill:#6d9bff}.vdfig .f-acs{fill:#1f2b45}.vdfig .f-bd{fill:#fb8b5b}
.vdfig .f-bds{fill:#3a2218}.vdfig .f-ok{fill:#4ade80}.vdfig .f-sf{fill:#222733}.vdfig .f-bg{fill:#1a1e26}}
</style>
<rect x="90.0" y="80.0" width="50.0" height="30.0" rx="0" class="f-bds" stroke-width="0"/>
<rect x="30.0" y="40.0" width="110.0" height="70.0" rx="0" class="s-ac" fill="none" stroke-width="2"/>
<rect x="90.0" y="80.0" width="100.0" height="80.0" rx="0" class="s-bd" fill="none" stroke-width="2"/>
<text x="38.0" y="102.0" class="f-ac" font-size="13" text-anchor="start" font-weight="bold">A</text>
<text x="98.0" y="152.0" class="f-bd" font-size="13" text-anchor="start" font-weight="bold">B</text>
<text x="110.0" y="24.0" class="f-fg" font-size="14" text-anchor="middle" font-weight="bold">IoU</text>
<text x="115.0" y="100.0" class="f-bd" font-size="11" text-anchor="middle">A∩B</text>
<text x="110.0" y="196.0" class="f-mu" font-size="12" text-anchor="middle">교집합 ÷ 합집합</text>

<rect x="266.0" y="40.0" width="110.0" height="70.0" rx="0" class="f-bg" stroke-width="0"/>
<rect x="326.0" y="80.0" width="100.0" height="80.0" rx="0" class="f-bg" stroke-width="0"/>
<rect x="326.0" y="80.0" width="50.0" height="30.0" rx="0" class="f-bds" stroke-width="0"/>

<text x="510.0" y="102.0" class="f-ac" font-size="13" text-anchor="start" font-weight="bold">A</text>
<text x="570.0" y="152.0" class="f-bd" font-size="13" text-anchor="start" font-weight="bold">B</text>
<text x="582.0" y="24.0" class="f-fg" font-size="14" text-anchor="middle" font-weight="bold">DIoU</text>
<line x1="502.0" y1="40.0" x2="662.0" y2="160.0" class="s-mu" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="557.0" y1="75.0" x2="612.0" y2="120.0" class="s-fg" stroke-width="2"/>
<circle cx="557.0" cy="75.0" r="3.5" class="f-ac"/>
<circle cx="612.0" cy="120.0" r="3.5" class="f-bd"/>
<text x="576.5" y="99.5" class="f-fg" font-size="14" text-anchor="end" font-weight="bold">ρ</text>
<text x="648.0" y="139.0" class="f-mu" font-size="14" text-anchor="middle" font-weight="bold">c</text>
<text x="582.0" y="196.0" class="f-mu" font-size="12" text-anchor="middle">ρ² ÷ c² 를 뺌</text>
</svg>

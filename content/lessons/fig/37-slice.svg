<svg xmlns="http://www.w3.org/2000/svg" class="vdfig" viewBox="0 0 780 290" role="img" aria-label="가로로 이웃한 타일 A와 B가 겹침 구간을 공유함. 겹침 안의 차는 두 타일이 모두 잡아 전역 좌표로 옮긴 뒤 NMS로 하나를 지움. 겹침보다 긴 선박은 어느 타일에도 온전히 들어가지 않아 두 타일이 각각 잘린 조각 상자를 내고, 두 조각의 IoU가 0.33이라 NMS로 지워지지 않음. 전체를 줄여 한 번 추론하면 선박 전체를 덮는 상자 하나가 나옴">
<style>
.vdfig{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
.vdfig .s-fg{stroke:#1c2330}.vdfig .s-mu{stroke:#8a93a3}.vdfig .s-ac{stroke:#2563eb}.vdfig .s-bd{stroke:#c2410c}.vdfig .s-ok{stroke:#15803d}
.vdfig .f-fg{fill:#1c2330}.vdfig .f-mu{fill:#5a6475}.vdfig .f-ac{fill:#2563eb}.vdfig .f-acs{fill:#e6eefe}.vdfig .f-bd{fill:#c2410c}
.vdfig .f-bds{fill:#fdeee6}.vdfig .f-ok{fill:#15803d}.vdfig .f-sf{fill:#f0f2f5}.vdfig .f-bg{fill:#ffffff}
@media (prefers-color-scheme:dark){
.vdfig .s-fg{stroke:#e6e9ef}.vdfig .s-mu{stroke:#737c8c}.vdfig .s-ac{stroke:#6d9bff}.vdfig .s-bd{stroke:#fb8b5b}.vdfig .s-ok{stroke:#4ade80}
.vdfig .f-fg{fill:#e6e9ef}.vdfig .f-mu{fill:#a7afbd}.vdfig .f-ac{fill:#6d9bff}.vdfig .f-acs{fill:#1f2b45}.vdfig .f-bd{fill:#fb8b5b}
.vdfig .f-bds{fill:#3a2218}.vdfig .f-ok{fill:#4ade80}.vdfig .f-sf{fill:#222733}.vdfig .f-bg{fill:#1a1e26}}
</style>
<rect x="240.0" y="52.0" width="80.0" height="210.0" rx="0" class="s-mu f-sf" stroke-width="0"/>
<rect x="40.0" y="52.0" width="280.0" height="210.0" class="s-ac" fill="none" stroke-width="1.8"/>
<rect x="240.0" y="56.0" width="280.0" height="202.0" class="s-bd" fill="none" stroke-width="1.8"/>
<text x="44.0" y="42.0" class="f-ac" font-size="13" text-anchor="start" font-weight="600">타일 A</text>
<text x="516.0" y="42.0" class="f-bd" font-size="13" text-anchor="end" font-weight="600">타일 B</text>
<text x="280.0" y="42.0" class="f-mu" font-size="12" text-anchor="middle">겹침</text>
<rect x="270.0" y="104.0" width="20.0" height="10.0" rx="0" class="s-fg f-mu" stroke-width="1"/>
<rect x="266.0" y="100.0" width="27.0" height="18.0" class="s-ac" fill="none" stroke-width="1.4"/>
<rect x="268.0" y="98.0" width="26.0" height="19.0" class="s-bd" fill="none" stroke-width="1.4"/>
<text x="280.0" y="140.0" class="f-fg" font-size="11" text-anchor="middle">두 번 잡힘</text>
<text x="280.0" y="155.0" class="f-fg" font-size="11" text-anchor="middle">→ NMS로 하나</text>
<rect x="180.0" y="196.0" width="240.0" height="20.0" rx="0" class="s-fg f-mu" stroke-width="1"/>
<rect x="174.0" y="182.0" width="252.0" height="48.0" class="s-ok" fill="none" stroke-width="1.6"/>
<rect x="179.0" y="190.0" width="141.0" height="32.0" class="s-ac" fill="none" stroke-width="1.6"/>
<rect x="240.0" y="187.0" width="181.0" height="38.0" class="s-bd" fill="none" stroke-width="1.6"/>
<text x="210.0" y="246.0" class="f-ac" font-size="11" text-anchor="middle">조각 A</text>
<text x="370.0" y="246.0" class="f-bd" font-size="11" text-anchor="middle">조각 B</text>
<line x1="560.0" y1="80.0" x2="586.0" y2="80.0" class="s-ac" stroke-width="1.6"/>
<text x="594.0" y="84.0" class="f-fg" font-size="12" text-anchor="start">타일 A의 상자</text>
<line x1="560.0" y1="106.0" x2="586.0" y2="106.0" class="s-bd" stroke-width="1.6"/>
<text x="594.0" y="110.0" class="f-fg" font-size="12" text-anchor="start">타일 B의 상자</text>
<line x1="560.0" y1="132.0" x2="586.0" y2="132.0" class="s-ok" stroke-width="1.6"/>
<text x="594.0" y="136.0" class="f-fg" font-size="12" text-anchor="start">전체 축소 추론의 상자</text>
<text x="560.0" y="186.0" class="f-fg" font-size="12" text-anchor="start">조각 A·B의 IoU 0.33</text>
<text x="560.0" y="204.0" class="f-fg" font-size="12" text-anchor="start">→ NMS 0.5로 안 지워짐</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" class="vdfig" viewBox="0 0 680 305" role="img" aria-label="학습 단계(레이블과 손실로 파라미터를 갱신)와 추론 단계(고정된 모델로 새 장면을 예측)의 흐름">
<style>

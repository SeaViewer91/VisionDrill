<svg xmlns="http://www.w3.org/2000/svg" class="vdfig" viewBox="0 0 680 315" role="img" aria-label="핀홀 투영: 투영 중심, 영상면, 초점거리 f, 거리 Z, 지상 점 P와 영상 좌표 x, 화소 크기 p와 GSD">

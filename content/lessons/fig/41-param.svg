<svg xmlns="http://www.w3.org/2000/svg" class="vdfig" viewBox="0 0 780 300" role="img" aria-label="왼쪽: 회전 박스의 5파라미터(중심 cx·cy, 긴 변 w, 짧은 변 h, 긴 변이 x축과 이루는 각 θ). 영상 좌표는 y가 아래라 θ = +30°는 화면에서 시계 방향. 가운데: 같은 상자의 8파라미터(꼭짓점 1→4를 시계 방향으로). 오른쪽: 거의 세로인 두 상자 −88°와 89°는 실제로 3° 차이지만 값은 177 차이">

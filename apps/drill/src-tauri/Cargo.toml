[package]
name = "visiondrill"
version = "0.1.1"
description = "VisionDrill"
authors = ["SeaViewer91"]
license = "MIT"
edition = "2021"

[lib]
name = "visiondrill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
